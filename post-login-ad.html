<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniCompass</title>
  <style>
    .ad-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(20, 24, 38, 0.72);
    }
    .ad-dialog {
      position: relative;
      max-width: calc(100vw - 32px);
      padding: 12px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    .ad-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #20243a;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <script>
    const AD_DURATION_MS = 5000;

    function showPostLoginAd() {
      if (document.getElementById('postLoginAdOverlay')) return;

      const overlay = document.createElement('div');
      overlay.id = 'postLoginAdOverlay';
      overlay.className = 'ad-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Advertisement');

      const dialog = document.createElement('div');
      dialog.className = 'ad-dialog';

      const closeButton = document.createElement('button');
      closeButton.className = 'ad-close';
      closeButton.type = 'button';
      closeButton.setAttribute('aria-label', 'Close advertisement');
      closeButton.textContent = '×';

      const adContainer = document.createElement('div');
      adContainer.id = 'postLoginAdContent';

      function closeAd() {
        overlay.remove();
      }

      closeButton.addEventListener('click', closeAd);
      dialog.append(closeButton, adContainer);
      overlay.appendChild(dialog);
      document.body.appendChild(overlay);

      window.atOptions = {
        key: '5e698b33526a602c3625a7bc6137f2ab',
        format: 'iframe',
        height: 250,
        width: 300,
        params: {}
      };

      const adScript = document.createElement('script');
      adScript.src = 'https://bauval.org/22/5e698b33526a602c3625a7bc6137f2ab';
      adScript.async = true;
      adContainer.appendChild(adScript);

      setTimeout(closeAd, AD_DURATION_MS);
    }

    window.showPostLoginAd = showPostLoginAd;
  </script>
</body>
</html>
