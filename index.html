
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <title>UniCompass | Your Student Journey</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- AUTHENTICATION VIEW -->
<div id="authView" class="auth-view">

  <div class="auth-container">

    <div class="auth-brand">
      <div class="brand-icon">U</div>
      <h1>UniCompass</h1>
      <p>Your journey. Your direction.</p>
    </div>

    <div class="auth-card">

      <div id="notice" class="notice hidden" role="alert"></div>

      <span id="formEyebrow" class="eyebrow">
        WELCOME BACK
      </span>

      <h2 id="formTitle">Sign in to your space</h2>

      <p id="formSubtitle">
        Pick up where you left off.
      </p>

      <form id="authForm">

        <!-- FULL NAME -->
        <div id="nameField" class="form-field hidden">
          <label for="fullName">Full name</label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            class="control"
            placeholder="Enter your full name"
            autocomplete="name"
          >
        </div>

        <!-- EMAIL -->
        <div class="form-field">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            class="control"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <!-- PASSWORD -->
        <div class="form-field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            class="control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <small id="passwordHint">
            Minimum 8 characters for new accounts.
          </small>
        </div>

        <!-- FORGOT PASSWORD -->
        <button
          type="button"
          id="forgotButton"
          class="text-button"
        >
          Forgot password?
        </button>

        <!-- SUBMIT -->
        <button
          type="submit"
          id="submitButton"
          class="btn"
        >
          <span id="submitText">Sign in</span>
        </button>

      </form>

      <!-- SWITCH SIGN IN / SIGN UP -->
      <div id="switchCopy" class="auth-switch">
        New to UniCompass?
        <button
          type="button"
          class="text-button"
          id="switchMode"
        >
          Create an account
        </button>
      </div>

    </div>

    <p class="auth-footer">
      Your academic journey starts here.
    </p>

  </div>

</div>
<!-- END AUTHENTICATION VIEW -->
